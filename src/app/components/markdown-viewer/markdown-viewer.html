<div class="max-w-7xl mx-auto p-4 md:p-8 text-slate-800 w-full flex flex-col gap-4 h-[calc(100vh-64px)]">
  <div class="shrink-0">
    <h1 class="text-3xl font-bold text-slate-900 mb-1">Markdown Viewer</h1>
    <p class="text-slate-600 text-sm">Write or paste Markdown on the left and see the rendered preview on the right.</p>
  </div>

  <div class="flex flex-col md:flex-row gap-4 grow min-h-0">
    <!-- Editor -->
    <div class="flex-1 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden min-h-[300px]">
      <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
        <span class="text-sm font-semibold text-slate-600">Markdown</span>
        <button (click)="inputText.set('')" class="text-xs text-slate-400 hover:text-indigo-600 font-medium">Clear</button>
      </div>
      <textarea
        [ngModel]="inputText()"
        (ngModelChange)="inputText.set($event)"
        class="grow p-4 text-sm font-mono resize-none focus:outline-none bg-white"
        placeholder="# Hello\n\nStart typing **Markdown** here..."
      ></textarea>
    </div>

    <!-- Preview -->
    <div class="flex-1 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden min-h-[300px]">
      <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 shrink-0">
        <span class="text-sm font-semibold text-slate-600">Preview</span>
      </div>
      <div class="grow overflow-auto p-6">
        @if (renderedHtml()) {
          <div class="md-body" [innerHTML]="renderedHtml()"></div>
        } @else {
          <p class="text-slate-400 text-sm text-center mt-10">Preview will appear here...</p>
        }
      </div>
    </div>
  </div>
</div>
