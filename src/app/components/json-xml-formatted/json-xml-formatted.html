<div class="max-w-6xl mx-auto p-4 md:p-8 text-slate-800 w-full flex flex-col h-full h-[calc(100vh-64px)]">
  <div class="mb-4 shrink-0">
    <h1 class="text-3xl font-bold text-slate-900 mb-2">Text Formatter</h1>
    <p class="text-slate-600">Beautify and format JSON, XML, HTML, SQL, and URL query strings.</p>
  </div>

  <div class="flex flex-wrap gap-3 mb-4 shrink-0">
    @for (fmt of formats; track fmt) {
      <button
        (click)="selectedType.set(fmt)"
        [class.bg-indigo-600]="selectedType() === fmt"
        [class.text-white]="selectedType() === fmt"
        [class.bg-white]="selectedType() !== fmt"
        [class.text-slate-700]="selectedType() !== fmt"
        class="px-6 py-2 rounded-lg font-semibold shadow-sm border border-slate-200 transition-colors"
      >
        {{ formatLabels[fmt] }}
      </button>
    }
  </div>

  <div class="flex flex-col md:flex-row gap-6 grow min-h-[400px]">
    <!-- Input Section -->
    <div class="flex-1 flex flex-col bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center shrink-0">
        <h2 class="font-semibold text-slate-700">Input {{ formatLabels[selectedType()] }}</h2>
        <button
          (click)="inputText.set('')"
          class="text-sm text-slate-500 hover:text-indigo-600 font-medium"
        >
          Clear
        </button>
      </div>
      <div class="p-4 grow flex flex-col">
        <textarea
          [ngModel]="inputText()"
          (ngModelChange)="inputText.set($event)"
          class="w-full grow p-4 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm font-mono resize-none"
          [placeholder]="'Paste your ' + formatLabels[selectedType()] + ' text here...'"
        ></textarea>
      </div>
    </div>

    <!-- Output Section -->
    <div class="flex-1 flex flex-col bg-slate-900 rounded-xl shadow-sm overflow-hidden">
      <div class="px-4 py-3 bg-slate-800 border-b border-slate-700 flex justify-between items-center shrink-0">
        <h2 class="font-semibold text-slate-200">Formatted Output</h2>
        <button
          (click)="copyToClipboard()"
          class="text-sm text-indigo-400 hover:text-indigo-300 font-medium flex gap-2 items-center"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy
        </button>
      </div>
      <div class="p-4 grow overflow-auto relative">
        @if (formattedText()) {
          <pre class="text-sm text-emerald-400 font-mono tab-size-2"><code>{{ formattedText() }}</code></pre>
        } @else {
          <div class="absolute inset-0 flex items-center justify-center text-slate-500 text-sm font-medium">
            Waiting for input...
          </div>
        }
      </div>
    </div>
  </div>
</div>
